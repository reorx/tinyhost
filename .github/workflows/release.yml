name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Read release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/reorx/tinyhost-server:$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/reorx/tinyhost-server:$version,ghcr.io/reorx/tinyhost-server:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make dist VERSION="$VERSION"
          (cd dist && sha256sum -c checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/reorx/tinyhost
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify image versions on both architectures
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            actual=$(docker run --rm --platform "linux/$arch" "ghcr.io/reorx/tinyhost-server:$VERSION" version)
            test "$actual" = "$VERSION"
          done
      # A plain `docker run -v NAME:/data` must work as nonroot and turn healthy.
      - name: Verify nonroot user, fresh named volume and healthcheck on both architectures
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/reorx/tinyhost-server:$VERSION"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 65532:65532
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image" | grep -F '"/tinyhost-server","healthcheck"'
          for arch in amd64 arm64; do
            name="verify-$arch"
            docker run -d --name "$name" --platform "linux/$arch" -v "$name:/data" \
              -e TINYHOST_APPS_URL=http://apps.test -e TINYHOST_ADMIN_URL=http://admin.test "$image"
            status=starting
            for _ in $(seq 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$name")
              if [ "$status" = healthy ] || [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then break; fi
              sleep 2
            done
            docker logs "$name"
            echo "$arch health: $status"
            test "$status" = healthy
            docker exec "$name" /tinyhost-server token create --name release-verify --data-dir /data > /dev/null
            docker rm -f "$name"
            docker volume rm "$name"
          done
