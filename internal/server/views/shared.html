{{define "nav"}}<nav aria-label="后台导航"><a href="/">App</a> <a href="/trash">回收站</a> <a href="/agents">Agent</a> <a href="/events">操作记录</a></nav><form action="/logout" method="post"><button>退出</button></form><form action="/logout-all" method="post" data-confirm="退出所有浏览器的后台和私有查看会话？"><button>退出所有会话</button></form>{{end}}
{{define "audit"}}<table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>App</th><th>摘要</th></tr></thead><tbody>{{range .}}<tr><td>{{.At}}</td><td>{{.ActorName}} ({{.Actor}})</td><td>{{.Action}}</td><td>{{if .AppSlug}}<a href="/events?app={{.AppID}}">{{.AppSlug}}</a>{{else}}{{.AppID}}{{end}}</td><td>{{.Detail}}</td></tr>{{else}}<tr><td colspan="5">暂无操作记录</td></tr>{{end}}</tbody></table>{{end}}
