<!doctype html><html lang="zh"><meta charset="utf-8"><title>授权 Agent</title><h1>授权 Agent</h1><p>{{.Message}}</p>{{with .Request}}<dl><dt>名称</dt><dd>{{.Name}}</dd><dt>设备信息（含主机、系统、架构、版本和来源 IP）</dt><dd>{{.Meta}}</dd><dt>申请时间</dt><dd>{{.CreatedAt}}</dd><dt>验证码</dt><dd>{{.UserCode}}</dd></dl><form action="/device/{{.ID}}/approve" method="post"><label>名称 <input name="name" value="{{.Name}}" required></label><label>有效期 <select name="ttl"><option value="1d">1 天</option><option value="30d" selected>30 天</option><option value="forever">永久</option></select></label><button>批准</button></form><form action="/device/{{.ID}}/deny" method="post"><button>拒绝</button></form>{{end}}</html>
