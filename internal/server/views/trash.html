<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>回收站 · tinyhost</title><script src="/static/admin.js" defer></script></head><body>{{template "nav"}}<main><h1>回收站</h1><table><thead><tr><th>App</th><th>删除时间</th><th>剩余天数</th><th>操作</th></tr></thead><tbody>{{range .Apps}}<tr><td>{{.Slug}} · {{.Title}}</td><td>{{.DeletedAt}}</td><td>{{.DaysRemaining}} 天</td><td><form action="/trash/{{.ID}}/restore" method="post"><button>恢复</button></form><form action="/trash/{{.ID}}/purge" method="post" data-confirm="立即清理此 App 及所有版本？此操作无法恢复。"><button>立即清理</button></form></td></tr>{{else}}<tr><td colspan="4">回收站为空</td></tr>{{end}}</tbody></table></main></body></html>
